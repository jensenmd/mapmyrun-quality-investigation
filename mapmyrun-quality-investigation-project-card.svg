<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071329"/>
      <stop offset="0.58" stop-color="#102250"/>
      <stop offset="1" stop-color="#25184d"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f7ef7"/>
      <stop offset="1" stop-color="#9262e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1430" cy="120" r="260" fill="#7c5ce6" opacity="0.12"/>
  <circle cx="1230" cy="760" r="310" fill="#2570d9" opacity="0.11"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="105" y="118" fill="#93a8d7" font-size="30" font-weight="700" letter-spacing="5">QA PORTFOLIO PROJECT</text>
    <text x="105" y="205" fill="#ffffff" font-size="68" font-weight="800">MapMyRun Quality</text>
    <text x="105" y="278" fill="#ffffff" font-size="68" font-weight="800">Investigation</text>
    <text x="105" y="343" fill="#c8d5f5" font-size="31">Exploratory field investigation with</text>
    <text x="105" y="386" fill="#c8d5f5" font-size="31">positive findings and bounded conclusions</text>

    <g font-size="23" font-weight="650">
      <rect x="105" y="435" width="292" height="54" rx="27" fill="#244476" stroke="#5275b7"/>
      <text x="251" y="470" text-anchor="middle" fill="#e8efff">iPhone + Apple Watch</text>
      <rect x="415" y="435" width="210" height="54" rx="27" fill="#244476" stroke="#5275b7"/>
      <text x="520" y="470" text-anchor="middle" fill="#e8efff">GPS Evidence</text>
      <rect x="643" y="435" width="270" height="54" rx="27" fill="#4d337f" stroke="#8263bd"/>
      <text x="778" y="470" text-anchor="middle" fill="#f0eaff">User-Trust Analysis</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="104" y="540" width="810" height="220" rx="30" fill="#10203d" stroke="#38517e" stroke-width="2"/>
      <text x="155" y="606" fill="#8aa5dc" font-size="22" font-weight="700" letter-spacing="3">SCOPE</text>
      <text x="155" y="658" fill="#ffffff" font-size="30" font-weight="650">Real-world assessment</text>
      <text x="155" y="709" fill="#ffffff" font-size="30" font-weight="650">Evidence separated from inference</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1010" y="125" width="430" height="650" rx="64" fill="#0a1226" stroke="#7b88b7" stroke-width="4"/>
      <rect x="1038" y="158" width="374" height="584" rx="42" fill="url(#phone)" opacity="0.96"/>
      <rect x="1145" y="143" width="160" height="24" rx="12" fill="#0a1226"/>
      <text x="1225" y="245" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="3">FIELD TO JUDGMENT</text>
      <g text-anchor="middle" font-size="29" font-weight="800">
        <circle cx="1225" cy="338" r="54" fill="#ffffff" opacity="0.15" stroke="#ffffff"/>
        <text x="1225" y="348" fill="#ffffff">?</text>
        <text x="1225" y="420" fill="#ffffff">CURIOSITY</text>
        <path d="M1225 445 v54" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
        <path d="M1208 482 l17 19 17-19" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
        <circle cx="1225" cy="547" r="54" fill="#ffffff" opacity="0.15" stroke="#ffffff"/>
        <path d="M1194 548 l20 20 43-48" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="1225" y="630" fill="#ffffff">EVIDENCE</text>
        <text x="1225" y="688" fill="#ffffff">JUDGMENT</text>
      </g>
    </g>

    <g filter="url(#shadow)">
      <rect x="1010" y="800" width="430" height="0" fill="none"/>
      <rect x="970" y="730" width="510" height="142" rx="26" fill="#161737" stroke="#8d72d9" stroke-width="2"/>
      <text x="1225" y="775" text-anchor="middle" fill="#a99aee" font-size="21" font-weight="800" letter-spacing="3">CORE INSIGHT</text>
      <text x="1225" y="818" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="750">Working as designed</text>
      <text x="1225" y="853" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="750">can still reduce trust</text>
    </g>

    <text x="105" y="835" fill="#8ea5d1" font-size="26" font-weight="600">Michael D. Jensen · Senior QA Engineer</text>
  </g>
</svg>
